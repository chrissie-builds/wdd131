<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 | Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <meta name="description" content="WDD 131 Dynamic Web Fundamentals product review form assignment.">
    <meta name="author" content="Chrissie">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
      <fieldset>
        <legend>Product Review</legend>

        <!-- Product Name -->
        <div class="field">
          <label for="productName">Product Name</label>
          <select id="productName" name="productName" required>
            <option value="" disabled selected>Choose a Product ...</option>
          </select>
        </div>

        <!-- Overall Rating -->
        <div class="field">
          <span class="label-text">Overall Rating</span>
          <div class="rating-group" role="group" aria-labelledby="rating-label">
            <label><input type="radio" name="rating" value="1" required> &#9734;</label>
            <label><input type="radio" name="rating" value="2" required> &#9734;&#9734;</label>
            <label><input type="radio" name="rating" value="3" required> &#9734;&#9734;&#9734;</label>
            <label><input type="radio" name="rating" value="4" required> &#9734;&#9734;&#9734;&#9734;</label>
            <label><input type="radio" name="rating" value="5" required> &#9734;&#9734;&#9734;&#9734;&#9734;</label>
          </div>
        </div>

        <!-- Date of Installation -->
        <div class="field">
          <label for="installDate">Date of Installation</label>
          <input type="date" id="installDate" name="installDate" required>
        </div>

        <!-- Useful Features -->
        <fieldset class="checkbox-group">
          <legend>Which features did you find useful in the product? <span class="optional">(Check all that apply)</span></legend>
          <label><input type="checkbox" name="features" value="durability"> Durability</label>
          <label><input type="checkbox" name="features" value="easeOfUse"> Ease of Use</label>
          <label><input type="checkbox" name="features" value="performance"> Performance</label>
          <label><input type="checkbox" name="features" value="design"> Design</label>
        </fieldset>

        <!-- Written Review -->
        <div class="field">
          <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
          <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>
        </div>

        <!-- User Name -->
        <div class="field">
          <label for="userName">Your Name <span class="optional">(Optional)</span></label>
          <input type="text" id="userName" name="userName">
        </div>

        <!-- Submit Button -->
        <div class="field submit-btn">
          <input type="submit" value="Post Review">
        </div>
      </fieldset>
    </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Chrissie. South Africa</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
